name: Build and test

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths-ignore:
      - LICENSE
      - README.md
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  # Keep manual runs independent while replacing outdated push and PR runs.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  building-and-testing-linux:
    name: Building and testing Linux (${{ matrix.configuration }}, ${{ matrix.architecture.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        configuration: [ Debug, Release ]
        architecture:
          - name: x86
            flag: -m32
          - name: x86_64
            flag: -m64

    defaults:
      run:
        shell: bash

    env:
      CONFIGURATION: ${{ matrix.configuration }}
      ARCHITECTURE_FLAG: ${{ matrix.architecture.flag }}
      BUILD_DIRECTORY: build/linux/${{ matrix.architecture.name }}/${{ matrix.configuration }}

    steps:
      - name: Checking out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installing Linux x86 build dependencies
        if: ${{ matrix.architecture.name == 'x86' }}
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends g++-multilib

      - name: Building Linux (${{ matrix.configuration }}, ${{ matrix.architecture.name }})
        id: build
        timeout-minutes: 10
        run: |
          set -euo pipefail
          flags=("$ARCHITECTURE_FLAG" -std=c++17 -Wall -Wextra -Wpedantic -Werror -pthread -I. -DDETOURS_NOINLINE=)
          if [[ "$CONFIGURATION" == "Debug" ]]; then
            flags+=(-O0 -g3 -D_DEBUG)
          else
            flags+=(-O2 -DNDEBUG)
          fi
          mkdir -p "$BUILD_DIRECTORY"
          g++ --version | tee "$BUILD_DIRECTORY/build.log"
          g++ "${flags[@]}" -c Detours.cpp -o "$BUILD_DIRECTORY/Detours.o" 2>&1 | tee -a "$BUILD_DIRECTORY/build.log"
          g++ "${flags[@]}" -c main.cpp -o "$BUILD_DIRECTORY/main.o" 2>&1 | tee -a "$BUILD_DIRECTORY/build.log"
          g++ "$ARCHITECTURE_FLAG" "$BUILD_DIRECTORY/Detours.o" "$BUILD_DIRECTORY/main.o" -ldl -pthread -o "$BUILD_DIRECTORY/Detours" 2>&1 | tee -a "$BUILD_DIRECTORY/build.log"
          # Preserve executable permissions when the artifact is downloaded.
          tar -czf "$BUILD_DIRECTORY/Detours.tar.gz" -C "$BUILD_DIRECTORY" Detours

      - name: Testing Linux (${{ matrix.configuration }}, ${{ matrix.architecture.name }})
        timeout-minutes: 10
        run: |
          set -euo pipefail
          "$BUILD_DIRECTORY/Detours" --no-colors 2>&1 | tee "$BUILD_DIRECTORY/test.log"

      - name: Uploading Linux build and diagnostics
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Detours-linux-${{ matrix.architecture.name }}-${{ matrix.configuration }}
          path: |
            ${{ env.BUILD_DIRECTORY }}/Detours.tar.gz
            ${{ env.BUILD_DIRECTORY }}/*.log
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  building-and-testing-windows:
    name: Building and testing Windows (${{ matrix.configuration }}, ${{ matrix.platform }})
    runs-on: windows-2022
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        configuration: [ Debug, Release ]
        platform: [ x86, x64 ]
        include:
          - platform: x86
            architecture: x86
          - platform: x64
            architecture: x86_64

    defaults:
      run:
        shell: pwsh

    env:
      CONFIGURATION: ${{ matrix.configuration }}
      PLATFORM: ${{ matrix.platform }}
      BUILD_DIRECTORY: build/${{ matrix.architecture }}/${{ matrix.configuration }}

    steps:
      - name: Checking out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
        with:
          msbuild-architecture: x64

      - name: Building Windows (${{ matrix.configuration }}, ${{ matrix.platform }})
        id: build
        timeout-minutes: 15
        run: |
          New-Item -ItemType Directory -Path $env:BUILD_DIRECTORY -Force | Out-Null
          msbuild Detours.sln /m /nr:false /nologo /verbosity:minimal "/p:Configuration=$env:CONFIGURATION" "/p:Platform=$env:PLATFORM" "/bl:$env:BUILD_DIRECTORY/build.binlog" 2>&1 | Tee-Object -FilePath "$env:BUILD_DIRECTORY/build.log"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Testing Windows (${{ matrix.configuration }}, ${{ matrix.platform }})
        timeout-minutes: 10
        run: |
          & "$env:BUILD_DIRECTORY/Detours.exe" --no-colors 2>&1 | Tee-Object -FilePath "$env:BUILD_DIRECTORY/test.log"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Uploading Windows build and diagnostics
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Detours-windows-${{ matrix.architecture }}-${{ matrix.configuration }}
          path: |
            ${{ env.BUILD_DIRECTORY }}/*.exe
            ${{ env.BUILD_DIRECTORY }}/*.pdb
            ${{ env.BUILD_DIRECTORY }}/*.log
            ${{ env.BUILD_DIRECTORY }}/*.binlog
          if-no-files-found: error
          retention-days: 7
          overwrite: true
